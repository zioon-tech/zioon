name: Shared reader proxy
on:
  workflow_dispatch:
    inputs:
      ci-run:
        description: Successful main-branch Zioon CI run for this commit
        type: string
        required: true
      check-only:
        description: Validate the planned route without changing active configuration
        type: boolean
        default: true
permissions:
  contents: read
  actions: read
  id-token: write
concurrency:
  group: production-zioon-shared-reader-proxy
  cancel-in-progress: false
jobs:
  proxy:
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: zioon-tech/workflows
          ref: fc1aa3eca535b0c07accb9cdb8b885281c64ec4a
          path: .release-tools
          persist-credentials: false
      - name: Verify configuration transaction
        run: python3 scripts/operations/share-proxy.py --self-test
      - name: Apply verified shared reader route
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RUN: ${{ inputs.ci-run }}
          CHECK_ONLY: ${{ inputs.check-only }}
          DEPLOY_ROLE_ARN: ${{ vars.DEPLOY_ROLE_ARN }}
          DEPLOY_OIDC_PROVIDER_ARN: ${{ vars.DEPLOY_OIDC_PROVIDER_ARN }}
          DEPLOY_INSTANCE_ID: ${{ vars.DEPLOY_INSTANCE_ID }}
        run: python3 scripts/operations/run-share-proxy.py

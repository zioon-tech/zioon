name: Zioon CI
on:
  pull_request:
  push:
    branches: [main, "migration/**"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: zioon-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      runtime: ${{ steps.affected.outputs.runtime }}
      workbench: ${{ steps.affected.outputs.workbench }}
      portals: ${{ steps.affected.outputs.portals }}
      marketplace: ${{ steps.affected.outputs.marketplace }}
      site: ${{ steps.affected.outputs.site }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - id: affected
        run: node scripts/ci/affected.mjs
  secrets:
    uses: zioon-tech/workflows/.github/workflows/secret-scan.yml@c393e2bb7646ec3e3ac889c5548f6c719d3ca2bc
  runtime:
    needs: changes
    if: needs.changes.outputs.runtime == 'true'
    uses: zioon-tech/workflows/.github/workflows/node-ci.yml@c393e2bb7646ec3e3ac889c5548f6c719d3ca2bc
    with:
      install: npm ci && npm ci --prefix apps/runtime && npm ci --prefix apps/device-connector && npm ci --prefix packages/sandbox
      command: npm run runtime:build && npm run build && npm run runtime:test && npm --prefix packages/plugin-sdk test
      release-component: runtime
      artifact-name: zioon-runtime-${{ github.sha }}
      artifact-path: .release-out/runtime
  workbench:
    needs: changes
    if: needs.changes.outputs.workbench == 'true'
    uses: zioon-tech/workflows/.github/workflows/node-ci.yml@c393e2bb7646ec3e3ac889c5548f6c719d3ca2bc
    with:
      install: npm ci && npm ci --prefix apps/runtime
      command: npm run runtime:build && npm run build && npm exec vitest run
      release-component: workbench
      artifact-name: zioon-workbench-${{ github.sha }}
      artifact-path: .release-out/workbench
  portals:
    needs: changes
    if: needs.changes.outputs.portals == 'true'
    uses: zioon-tech/workflows/.github/workflows/node-ci.yml@c393e2bb7646ec3e3ac889c5548f6c719d3ca2bc
    with:
      install: npm ci && npm ci --prefix apps/runtime
      command: npm run runtime:build && npm run test:mobile && npm exec vitest run -- --config apps/admin/vitest.config.ts && node --test apps/client-portal/tests/*.test.mjs && ZION_MOBILE_BASE=/ npm run build:mobile && npm exec vite build -- --config apps/admin/vite.config.ts
      release-component: portals
      artifact-name: zioon-portals-${{ github.sha }}
      artifact-path: .release-out/portals
  marketplace:
    needs: changes
    if: needs.changes.outputs.marketplace == 'true'
    uses: zioon-tech/workflows/.github/workflows/node-ci.yml@c393e2bb7646ec3e3ac889c5548f6c719d3ca2bc
    with:
      install: npm ci && npm ci --prefix apps/runtime && npm ci --prefix apps/marketplace
      command: npm run runtime:build && npm --prefix apps/marketplace run build && npm --prefix apps/marketplace test
      release-component: marketplace
      artifact-name: zioon-marketplace-${{ github.sha }}
      artifact-path: .release-out/marketplace
  website:
    needs: changes
    if: needs.changes.outputs.site == 'true'
    uses: zioon-tech/workflows/.github/workflows/node-ci.yml@c393e2bb7646ec3e3ac889c5548f6c719d3ca2bc
    with:
      command: node scripts/build-zioon-cli.mjs && ZIOON_SITE_RELEASE_STATE=published npm --prefix apps/public-site run build && node scripts/verify-zioon-cli-release.mjs && npm --prefix apps/public-site run check
      release-component: public-site
      artifact-name: zioon-public-site-${{ github.sha }}
      artifact-path: .release-out/public-site
  cli-native:
    needs: changes
    if: needs.changes.outputs.runtime == 'true' || needs.changes.outputs.site == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.18.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - run: npm ci
      - run: node scripts/build-zioon-cli.mjs --unpacked-only
      - if: runner.os != 'Windows'
        run: python -m pip install pexpect==4.9.0 pyte==0.8.2
      - if: runner.os == 'Windows'
        run: python -m pip install pywinpty==2.0.15
      - run: python scripts/verify-zioon-native-pty.py cli-terminal-results
      - if: runner.os != 'Windows'
        run: python scripts/verify-zioon-workflow-pty.py packages/zioon-cli/bin/zioon.mjs cli-terminal-results
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cli-terminal-${{ matrix.os }}-${{ github.sha }}
          path: cli-terminal-results
          if-no-files-found: error
          retention-days: 14
  required:
    name: CI
    runs-on: ubuntu-24.04
    if: always()
    needs: [changes, secrets, runtime, workbench, portals, marketplace, website, cli-native]
    steps:
      - env:
          FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: test "$FAILED" = false

name: Production release
on:
  workflow_dispatch:
    inputs:
      component:
        type: choice
        options: [public-site, workbench, portals, marketplace, runtime]
        required: true
      ci-run:
        description: Successful main-branch Zioon CI run ID
        type: string
        required: true
      check-only:
        description: Validate cloud access, artifact and disk without switching
        type: boolean
        default: true
      reuse-upload:
        description: Reuse selected CI objects from a successful preflight
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
  id-token: write
jobs:
  release:
    uses: zioon-tech/workflows/.github/workflows/deploy.yml@ae7efa0e401b1311be077a5a82cbef8727bee467
    with:
      component: ${{ inputs.component }}
      ci-run: ${{ inputs.ci-run }}
      check-only: ${{ inputs.check-only }}
      reuse-upload: ${{ inputs.reuse-upload }}

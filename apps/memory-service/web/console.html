<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>我的记忆 · Zioon Memory</title><meta name="robots" content="noindex"><meta name="theme-color" content="#ffffff"><link rel="icon" href="/favicon.svg?v=20261024"><link rel="stylesheet" href="/assets/site.css?v=20261024"><script type="module" src="/assets/console.js?v=20261024"></script></head>
<body class="console-body memory-app">
  <header class="console-header"><a class="home-brand" href="/"><span class="home-mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M20 7h-3a2 2 0 0 1-2-2V2"/><path d="M9 18a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h7l4 4v10a2 2 0 0 1-2 2Z"/><path d="M3 7.6v12.8A1.6 1.6 0 0 0 4.6 22h9.8"/></svg></span><span>Zioon <strong>Memory</strong></span></a><div class="account-actions"><a href="/docs">文档</a><span id="account-name">正在检查登录…</span><button id="logout" class="text-button" hidden>退出</button></div></header>
  <div id="notice" class="notice" role="status" hidden></div>
  <main class="console-layout" id="workspace" hidden>
    <aside class="console-sidebar"><div class="sidebar-title"><h1>我的记忆</h1><button id="new-file" class="small-button">新建文件</button></div><form id="search-form" role="search"><label class="sr-only" for="search">搜索记忆内容</label><input id="search" type="search" placeholder="搜索记忆内容" maxlength="120"><button class="search-submit" type="submit" aria-label="搜索">↵</button></form><div id="breadcrumbs" class="breadcrumbs" aria-label="当前目录"></div><div class="file-list-head"><span id="list-label">文件</span><button id="refresh" class="text-button">刷新</button></div><div id="files" class="file-list" aria-live="polite"></div><div class="sidebar-footer"><span class="status-dot"></span><span>网页与 CLI 共用一份记忆</span></div></aside>
    <section class="editor-pane"><div id="editor-empty" class="editor-empty"><span class="empty-symbol" aria-hidden="true">M</span><h2>从一份记忆开始。</h2><p>选择文件，查看与编辑原文。<br>你可以在这里整理背景、偏好和项目进展。</p><button class="button" id="empty-create">新建第一份记忆</button><a class="text-link" href="/docs">用 CLI 连接记忆 ↗</a></div><div id="editor-workspace" class="editor-workspace" hidden><div class="editor-toolbar"><div><h2 id="file-name"></h2><span id="file-path"></span></div><div class="editor-actions"><button id="history-button" class="small-button">版本历史</button><button id="download" class="small-button">下载</button><button id="save" class="button compact" disabled>保存</button></div></div><div class="editor-meta"><span id="save-state">已保存</span><span id="file-info"></span></div><label for="editor" class="sr-only">文件内容</label><textarea id="editor" spellcheck="false" aria-describedby="save-state"></textarea><div id="conflict" class="conflict-bar" role="alert" hidden><p>文件已在其他地方更新。你的编辑仍保留在这里，请先下载草稿，再读取最新版本。</p><button id="reload-file" class="small-button">读取最新版本</button></div></div></section>
  </main>
  <section id="login-needed" class="login-needed" hidden><p class="home-kicker">ZIOON MEMORY</p><h1>登录后，查看你的记忆。</h1><p>在这里浏览文件、搜索内容和整理笔记。</p><a class="button" href="/account/login">登录</a><a class="text-link" href="/docs">查看使用文档 ↗</a></section>
  <dialog id="create-dialog"><form id="create-form"><h2>新建记忆文件</h2><p>使用 Markdown 记录背景，或用 JSONL 保存事件。</p><label for="create-path">文件名或路径</label><input id="create-path" placeholder="profile.md" required maxlength="240"><div class="dialog-actions"><button type="button" id="cancel-create" class="small-button">取消</button><button class="button compact" type="submit">创建文件</button></div></form></dialog>
  <dialog id="history-dialog"><div class="history-heading"><h2>版本历史</h2><button id="close-history" class="text-button">关闭</button></div><p id="history-path"></p><div id="history-list"></div></dialog>
</body>
</html>
